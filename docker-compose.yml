version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: shopify-quiz-builder-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopify_quiz_builder
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - quiz-builder-network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: shopify-quiz-builder-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - quiz-builder-network

  # Admin Frontend (Next.js)
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile.dev
    container_name: shopify-quiz-builder-admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://quiz_user:quiz_password@postgres:5432/shopify_quiz_builder
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - quiz-builder-network

  # Backend API (NestJS)
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: shopify-quiz-builder-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - /app/dist
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://quiz_user:quiz_password@postgres:5432/shopify_quiz_builder
      - REDIS_URL=redis://redis:6379
      - PORT=4000
    depends_on:
      - postgres
      - redis
    networks:
      - quiz-builder-network

  # Storefront Component Development Server
  storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile.dev
    container_name: shopify-quiz-builder-storefront
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./apps/storefront:/app
      - /app/node_modules
      - /app/dist
    environment:
      - NODE_ENV=development
      - PORT=5000
    networks:
      - quiz-builder-network

  # Database Management Tool
  adminer:
    image: adminer:latest
    container_name: shopify-quiz-builder-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - quiz-builder-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  quiz-builder-network:
    driver: bridge
